name: Snowfall
options:
  bundleIdPrefix: com.xcode
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  Snowfall:
    type: application
    platform: macOS
    sources:
      - Snowfall
    info:
      path: Snowfall/Info.plist
      properties:
        CFBundleDisplayName: Snowfall
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xcode.snowfall
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SnowfallTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Snowfall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xcode.snowfall.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snowfall.app/Contents/MacOS/Snowfall"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Snowfall:
    build:
      targets:
        Snowfall: all
    test:
      targets:
        - SnowfallTests
